server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: base-boot
  profiles:
    active: dev

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.baseboot.module.*.entity,com.example.baseboot.module.product.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 令牌配置
jwt:
  # Base64 编码的密钥字符串（至少 256 位）
  secret: YmFzZS1ib290LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1hdXRoZW50aWNhdGlvbi0yMDI2
  expiration: 86400000 # 24 小时 (毫秒)
  header: Authorization
  token-prefix: "Bearer "

# SpringDoc OpenAPI 3 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh-CN
    swagger-model-name: 实体模型定义
    enable-search: true
    enable-open-api: true

